<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="100%" height="440" role="img" aria-label="Why SOCKS7">
  <defs>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#1a2a42" opacity="0.65"/>
      <circle cx="13" cy="11" r="0.7" fill="#152438" opacity="0.5"/>
      <circle cx="7" cy="17" r="0.6" fill="#1c3048" opacity="0.4"/>
    </pattern>
    <filter id="g"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .t{font-family:Georgia,'Times New Roman',serif}
      .m{font-family:ui-monospace,monospace}
      @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      @keyframes glow{0%,100%{opacity:0.5}50%{opacity:1}}
      .row{animation:fadeUp 0.8s ease-out both}
      .r1{animation-delay:0.1s}.r2{animation-delay:0.2s}.r3{animation-delay:0.3s}
      .r4{animation-delay:0.4s}.r5{animation-delay:0.5s}.r6{animation-delay:0.6s}.r7{animation-delay:0.7s}
      .glow{animation:glow 2s ease-in-out infinite}
    </style>
  </defs>
  <rect width="1100" height="440" rx="16" fill="#060a12"/><rect width="1100" height="440" rx="16" fill="url(#dots)"/>
  <g transform="translate(60,40)" filter="url(#g)">
    <circle r="16" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#0c1a2e" stroke="#00f0ff" stroke-width="1"/>
    <text text-anchor="middle" y="4" class="t" font-size="9" fill="#00f0ff" font-weight="700">𝑆7</text>
  </g>
  <text x="550" y="48" text-anchor="middle" class="t" font-size="22" fill="#cfe4ff" letter-spacing="3">𝑊ℎ𝑦 𝑆𝑂𝐶𝐾𝑆7 𝑒𝑥𝑖𝑠𝑡𝑠</text>
  <line x1="80" y1="70" x2="1020" y2="70" stroke="#152743" stroke-width="1"/>
  <text x="280" y="110" text-anchor="middle" class="t" font-size="15" fill="#5a7096">𝐶𝑙𝑎𝑠𝑠𝑖𝑐 𝑆𝑂𝐶𝐾𝑆5</text>
  <g class="glow" filter="url(#g)">
    <rect x="700" y="88" width="160" height="32" rx="8" fill="#0c1a2e" stroke="#00f0ff" stroke-width="1"/>
    <text x="780" y="110" text-anchor="middle" class="t" font-size="15" fill="#00f0ff">𝑆𝑂𝐶𝐾𝑆7</text>
  </g>
  <g class="row r1"><text x="80" y="155" class="m" font-size="13" fill="#7a90b0">𝑆𝑡𝑟𝑒𝑎𝑚𝑠 𝑝𝑒𝑟 𝑐𝑜𝑛𝑛𝑒𝑐𝑡𝑖𝑜𝑛</text><text x="280" y="155" text-anchor="middle" class="m" font-size="13" fill="#5a7096">1</text><text x="780" y="155" text-anchor="middle" class="m" font-size="13" fill="#00f0ff">𝑢𝑛𝑙𝑖𝑚𝑖𝑡𝑒𝑑 (𝑚𝑢𝑙𝑡𝑖𝑝𝑙𝑒𝑥𝑒𝑑)</text></g>
  <g class="row r2"><text x="80" y="195" class="m" font-size="13" fill="#7a90b0">𝐻𝑎𝑛𝑑𝑠ℎ𝑎𝑘𝑒</text><text x="280" y="195" text-anchor="middle" class="m" font-size="13" fill="#5a7096">𝑝𝑙𝑎𝑖𝑛𝑡𝑒𝑥𝑡</text><text x="780" y="195" text-anchor="middle" class="m" font-size="13" fill="#00f0ff">2-𝑅𝑇𝑇 𝑧𝑒𝑟𝑜-𝑘𝑛𝑜𝑤𝑙𝑒𝑑𝑔𝑒</text></g>
  <g class="row r3"><text x="80" y="235" class="m" font-size="13" fill="#7a90b0">𝐾𝑒𝑦 𝑒𝑥𝑐ℎ𝑎𝑛𝑔𝑒</text><text x="280" y="235" text-anchor="middle" class="m" font-size="13" fill="#5a7096">𝑛𝑜𝑛𝑒</text><text x="780" y="235" text-anchor="middle" class="m" font-size="13" fill="#00f0ff">𝑒𝑝ℎ𝑒𝑚𝑒𝑟𝑎𝑙 𝑋25519 + 𝑃𝑆𝐾</text></g>
  <g class="row r4"><text x="80" y="275" class="m" font-size="13" fill="#7a90b0">𝐶𝑖𝑝ℎ𝑒𝑟 𝑠𝑢𝑖𝑡𝑒</text><text x="280" y="275" text-anchor="middle" class="m" font-size="13" fill="#5a7096">𝑛𝑜𝑛𝑒 / 𝑒𝑥𝑡𝑒𝑟𝑛𝑎𝑙</text><text x="780" y="275" text-anchor="middle" class="m" font-size="13" fill="#00f0ff">𝑋𝐶ℎ𝑎𝐶ℎ𝑎20-𝑃𝑜𝑙𝑦1305</text></g>
  <g class="row r5"><text x="80" y="315" class="m" font-size="13" fill="#7a90b0">𝑈𝐷𝑃</text><text x="280" y="315" text-anchor="middle" class="m" font-size="13" fill="#5a7096">𝑎𝑤𝑘𝑤𝑎𝑟𝑑</text><text x="780" y="315" text-anchor="middle" class="m" font-size="13" fill="#00f0ff">𝑛𝑎𝑡𝑖𝑣𝑒, 𝑓𝑖𝑟𝑠𝑡-𝑐𝑙𝑎𝑠𝑠</text></g>
  <g class="row r6"><text x="80" y="355" class="m" font-size="13" fill="#7a90b0">𝐹𝑎𝑖𝑙𝑜𝑣𝑒𝑟</text><text x="280" y="355" text-anchor="middle" class="m" font-size="13" fill="#5a7096">𝑚𝑎𝑛𝑢𝑎𝑙</text><text x="780" y="355" text-anchor="middle" class="m" font-size="13" fill="#00f0ff">𝑎𝑢𝑡𝑜𝑚𝑎𝑡𝑖𝑐, 𝑙𝑒𝑎𝑠𝑡-𝑙𝑎𝑡𝑒𝑛𝑐𝑦</text></g>
  <g class="row r7"><text x="80" y="395" class="m" font-size="13" fill="#7a90b0">𝐹𝑖𝑛𝑔𝑒𝑟𝑝𝑟𝑖𝑛𝑡</text><text x="280" y="395" text-anchor="middle" class="m" font-size="13" fill="#5a7096">𝑜𝑏𝑣𝑖𝑜𝑢𝑠</text><text x="780" y="395" text-anchor="middle" class="m" font-size="13" fill="#00f0ff">𝑜𝑏𝑓𝑢𝑠𝑐𝑎𝑡𝑒𝑑 (𝑇𝐿𝑆 1.3)</text></g>
  <circle cx="1000" cy="420" r="4" fill="#3fe0a0"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
  <text x="1015" y="424" class="m" font-size="10" fill="#5a7096">𝑙𝑖𝑣𝑒</text>
</svg>
