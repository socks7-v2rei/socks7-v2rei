<style>
.c{font-family:ui-monospace,Menlo,monospace;font-size:9.5px}
@keyframes sc1{0%{transform:translateY(0)}100%{transform:translateY(-70px)}}
@keyframes sc2{0%{transform:translateY(0)}100%{transform:translateY(-60px)}}
@keyframes sc3{0%{transform:translateY(0)}100%{transform:translateY(-80px)}}
@keyframes sc4{0%{transform:translateY(0)}100%{transform:translateY(-65px)}}
.s1{animation:sc1 3.8s linear infinite}.s2{animation:sc2 3.5s linear infinite}
.s3{animation:sc3 4s linear infinite}.s4{animation:sc4 3.3s linear infinite}
@keyframes fl{0%{stroke-dashoffset:36}100%{stroke-dashoffset:0}}
@keyframes pk{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(130px);opacity:0}}
.fl{stroke-dasharray:5 8;animation:fl 1.1s linear infinite}
.p1{animation:pk 1.7s ease-in-out infinite}.p2{animation:pk 1.7s ease-in-out .3s infinite}
.p3{animation:pk 1.7s ease-in-out .6s infinite}.p4{animation:pk 1.7s ease-in-out .9s infinite}
.p5{animation:pk 1.7s ease-in-out 1.2s infinite}
