<g class="s2"><text x="310" y="48" class="c" fill="#8a5cff">match event {</text><text x="310" y="61" class="c" fill="#cfe4ff">  Open(id) =&gt; open(id),</text><text x="310" y="74" class="c" fill="#cfe4ff">  Data(f) =&gt; route(f),</text><text x="310" y="87" class="c" fill="#cfe4ff">  Close(id) =&gt; free(id),</text><text x="310" y="100" class="c" fill="#cfe4ff">  Rekey =&gt; rotate(),</text><text x="310" y="113" class="c" fill="#8a5cff">}</text><text x="310" y="126" class="c" fill="#3fe0a0">// lock-free</text><text x="310" y="139" class="c" fill="#8a5cff">match event {</text><text x="310" y="152" class="c" fill="#cfe4ff">  Open(id) =&gt; open(id),</text><text x="310" y="165" class="c" fill="#cfe4ff">  Data(f) =&gt; route(f),</text><text x="310" y="178" class="c" fill="#cfe4ff">  Close(id) =&gt; free(id),</text><text x="310" y="191" class="c" fill="#cfe4ff">  Rekey =&gt; rotate(),</text><text x="310" y="204" class="c" fill="#8a5cff">}</text><text x="310" y="217" class="c" fill="#3fe0a0">// lock-free</text></g>
<g class="s3"><text x="570" y="48" class="c" fill="#00f0ff">METRICS export</text><text x="570" y="61" class="c" fill="#5fd0ff">streams 12408</text><text x="570" y="74" class="c" fill="#8a5cff">rtt_ms 12</text><text x="570" y="87" class="c" fill="#cfe4ff">bytes_out 9.2e9</text><text x="570" y="100" class="c" fill="#5a7096">rekeys 47</text><text x="570" y="113" class="c" fill="#ff2fd0">failovers 2</text><text x="570" y="126" class="c" fill="#3fe0a0">uptime 99.99</text><text x="570" y="139" class="c" fill="#00f0ff">METRICS export</text><text x="570" y="152" class="c" fill="#5fd0ff">streams 12408</text><text x="570" y="165" class="c" fill="#8a5cff">rtt_ms 12</text><text x="570" y="178" class="c" fill="#cfe4ff">bytes_out 9.2e9</text><text x="570" y="191" class="c" fill="#5a7096">rekeys 47</text><text x="570" y="204" class="c" fill="#ff2fd0">failovers 2</text><text x="570" y="217" class="c" fill="#3fe0a0">uptime 99.99</text></g>
