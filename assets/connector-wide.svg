<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="100%" height="70" role="img" aria-label="wide tunnel connector">
  <defs>
    <linearGradient id="wcore" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00f0ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#8a5cff" stop-opacity="1"/>
      <stop offset="80%" stop-color="#ff2fd0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff2fd0" stop-opacity="0"/>
    </linearGradient>
    <filter id="wg">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes hflow {
        0%   { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodePulse {
        0%,100% { opacity: 0.4; }
        50%     { opacity: 1; }
      }
      .hflow {
        stroke-dasharray: 8 12;
        animation: hflow 2s linear infinite;
      }
      .node { animation: nodePulse 2.2s ease-in-out infinite; }
    </style>
  </defs>
  <line x1="80" y1="35" x2="1120" y2="35" stroke="url(#wcore)" stroke-width="2" filter="url(#wg)"/>
  <line x1="80" y1="35" x2="1120" y2="35" stroke="#00f0ff" stroke-width="1" opacity="0.4" class="hflow"/>
  <circle cx="200" cy="35" r="3" fill="#00f0ff" class="node" filter="url(#wg)"/>
  <circle cx="400" cy="35" r="3" fill="#5fd0ff" class="node" style="animation-delay:0.3s" filter="url(#wg)"/>
  <circle cx="600" cy="35" r="3.5" fill="#8a5cff" class="node" style="animation-delay:0.6s" filter="url(#wg)"/>
  <circle cx="800" cy="35" r="3" fill="#ff2fd0" class="node" style="animation-delay:0.9s" filter="url(#wg)"/>
  <circle cx="1000" cy="35" r="3" fill="#ff6ec7" class="node" style="animation-delay:1.2s" filter="url(#wg)"/>
</svg>
