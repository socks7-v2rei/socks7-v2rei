<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="480" role="img" aria-label="SOCKS7 multiplexed tunnel topology">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#060a12"/><stop offset="100%" stop-color="#0a1628"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00f0ff"/><stop offset="50%" stop-color="#8a5cff"/><stop offset="100%" stop-color="#ff2fd0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.lbl{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:12px;fill:#5fd0ff}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}.p{animation:pulse 2.5s ease-in-out infinite}</style>
  </defs>
  <rect width="1200" height="480" fill="url(#tbg)"/>
  <text x="600" y="36" text-anchor="middle" class="lbl" font-size="16" fill="#cfe4ff" letter-spacing="3">// SOCKS7 MULTIPLEXED FABRIC</text>
  <!-- client nodes -->
  <g filter="url(#glow)">
    <rect x="40" y="120" width="140" height="60" rx="8" fill="#101d33" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="110" y="155" text-anchor="middle" class="lbl">client-a</text>
    <rect x="40" y="210" width="140" height="60" rx="8" fill="#101d33" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="110" y="245" text-anchor="middle" class="lbl">client-b</text>
    <rect x="40" y="300" width="140" height="60" rx="8" fill="#101d33" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="110" y="335" text-anchor="middle" class="lbl">client-c</text>
  </g>
  <!-- mux socket -->
  <rect x="420" y="180" width="200" height="120" rx="12" fill="#0c1a2e" stroke="url(#neon)" stroke-width="2" filter="url(#glow)" class="p"/>
  <text x="520" y="230" text-anchor="middle" class="lbl" font-size="14" fill="#00f0ff">SINGLE SOCKET</text>
  <text x="520" y="255" text-anchor="middle" class="lbl" font-size="11" fill="#8a5cff">mux · xchacha20</text>
  <text x="520" y="275" text-anchor="middle" class="lbl" font-size="11" fill="#ff2fd0">TLS 1.3 cover</text>
  <!-- edge nodes -->
  <g filter="url(#glow)">
    <rect x="900" y="100" width="160" height="55" rx="8" fill="#101d33" stroke="#3fe0a0" stroke-width="1.5"/>
    <text x="980" y="133" text-anchor="middle" class="lbl" fill="#3fe0a0">edge-eu · 12ms</text>
    <rect x="900" y="180" width="160" height="55" rx="8" fill="#101d33" stroke="#3fe0a0" stroke-width="1.5"/>
    <text x="980" y="213" text-anchor="middle" class="lbl" fill="#3fe0a0">edge-us · 48ms</text>
    <rect x="900" y="260" width="160" height="55" rx="8" fill="#101d33" stroke="#3fe0a0" stroke-width="1.5"/>
    <text x="980" y="293" text-anchor="middle" class="lbl" fill="#3fe0a0">edge-ap · 89ms</text>
    <rect x="900" y="340" width="160" height="55" rx="8" fill="#101d33" stroke="#5a7096" stroke-width="1"/>
    <text x="980" y="373" text-anchor="middle" class="lbl" fill="#5a7096">edge-sa · standby</text>
  </g>
  <!-- connections -->
  <g stroke="#00f0ff" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M180 150 C280 150, 320 220, 420 220"/>
    <path d="M180 240 C280 240, 320 240, 420 240"/>
    <path d="M180 330 C280 330, 320 260, 420 260"/>
  </g>
  <g stroke="#3fe0a0" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M620 220 C720 220, 780 130, 900 130"/>
    <path d="M620 240 C720 240, 780 210, 900 210"/>
    <path d="M620 260 C720 260, 780 290, 900 290"/>
  </g>
  <text x="600" y="450" text-anchor="middle" class="lbl" font-size="11" fill="#40598a">many logical streams · one obfuscated socket · automatic least-latency failover</text>
</svg>
