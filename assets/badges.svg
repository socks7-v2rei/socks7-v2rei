<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="100%" height="110" role="img" aria-label="Badges">
  <defs>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#1a2a42" opacity="0.65"/>
      <circle cx="13" cy="11" r="0.7" fill="#152438" opacity="0.5"/>
      <circle cx="7" cy="17" r="0.6" fill="#1c3048" opacity="0.4"/>
    </pattern>
    <filter id="bg"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .m{font-family:ui-monospace,monospace;font-size:13px}
      @keyframes pulse{0%,100%{opacity:0.75}50%{opacity:1}}
      .p{animation:pulse 2.6s ease-in-out infinite}
    </style>
  </defs>
  <rect width="900" height="110" rx="12" fill="#060a12"/><rect width="900" height="110" rx="12" fill="url(#dots)"/>
  <g transform="translate(40,55)" filter="url(#bg)">
    <circle r="18" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="10" fill="#0c1a2e" stroke="#00f0ff" stroke-width="1"/>
    <text text-anchor="middle" y="4" font-family="Georgia,serif" font-size="10" fill="#00f0ff" font-weight="700">𝑆7</text>
  </g>
  <g class="p" filter="url(#bg)">
    <rect x="80" y="30" width="140" height="50" rx="12" fill="#0c1a2e" stroke="#00f0ff" stroke-width="1.2"/>
    <text x="150" y="60" text-anchor="middle" class="m" fill="#00f0ff">𝑣7.0 𝑠ℎ𝑖𝑝𝑝𝑖𝑛𝑔</text>
    <rect x="240" y="30" width="160" height="50" rx="12" fill="#0c1a2e" stroke="#8a5cff" stroke-width="1.2"/>
    <text x="320" y="60" text-anchor="middle" class="m" fill="#8a5cff">𝑋𝐶ℎ𝑎𝐶ℎ𝑎20</text>
    <rect x="420" y="30" width="150" height="50" rx="12" fill="#0c1a2e" stroke="#ff2fd0" stroke-width="1.2"/>
    <text x="495" y="60" text-anchor="middle" class="m" fill="#ff2fd0">2-𝑅𝑇𝑇 𝑍𝐾</text>
    <rect x="590" y="30" width="120" height="50" rx="12" fill="#0c1a2e" stroke="#3fe0a0" stroke-width="1.2"/>
    <text x="650" y="60" text-anchor="middle" class="m" fill="#3fe0a0">𝑚𝑢𝑥</text>
    <rect x="730" y="30" width="130" height="50" rx="12" fill="#0c1a2e" stroke="#5fd0ff" stroke-width="1.2"/>
    <text x="795" y="60" text-anchor="middle" class="m" fill="#5fd0ff">𝑇𝐿𝑆 1.3</text>
  </g>
</svg>
