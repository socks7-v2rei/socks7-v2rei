<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 80" width="720" height="80" role="img" aria-label="SOCKS7 badges">
  <defs>
    <linearGradient id="bgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#8a5cff"/>
      <stop offset="100%" stop-color="#ff2fd0"/>
    </linearGradient>
    <style>
      .badge { font-family: ui-monospace, 'JetBrains Mono', monospace; font-size: 12px; }
    </style>
  </defs>
  <rect width="720" height="80" fill="#060a12" rx="8"/>
  <!-- badge 1 -->
  <rect x="20" y="20" width="120" height="40" rx="6" fill="#101d33" stroke="#00f0ff" stroke-width="1"/>
  <text x="80" y="45" text-anchor="middle" class="badge" fill="#00f0ff">v7.0 shipping</text>
  <!-- badge 2 -->
  <rect x="160" y="20" width="140" height="40" rx="6" fill="#101d33" stroke="#8a5cff" stroke-width="1"/>
  <text x="230" y="45" text-anchor="middle" class="badge" fill="#8a5cff">XChaCha20-Poly1305</text>
  <!-- badge 3 -->
  <rect x="320" y="20" width="130" height="40" rx="6" fill="#101d33" stroke="#ff2fd0" stroke-width="1"/>
  <text x="385" y="45" text-anchor="middle" class="badge" fill="#ff2fd0">2-RTT ZK handshake</text>
  <!-- badge 4 -->
  <rect x="470" y="20" width="110" height="40" rx="6" fill="#101d33" stroke="#3fe0a0" stroke-width="1"/>
  <text x="525" y="45" text-anchor="middle" class="badge" fill="#3fe0a0">mux streams</text>
  <!-- badge 5 -->
  <rect x="600" y="20" width="100" height="40" rx="6" fill="#101d33" stroke="#5fd0ff" stroke-width="1"/>
  <text x="650" y="45" text-anchor="middle" class="badge" fill="#5fd0ff">TLS 1.3 cover</text>
</svg>
