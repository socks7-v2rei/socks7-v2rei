<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%" height="160" role="img" aria-label="SOCKS7 blink connector">
  <defs>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#1a2a42" opacity="0.5"/>
      <circle cx="13" cy="11" r="0.55" fill="#152438" opacity="0.4"/>
    </pattern>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/><stop offset="40%" stop-color="#00f0ff" stop-opacity="1"/><stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5fd0ff" stop-opacity="0"/><stop offset="40%" stop-color="#5fd0ff" stop-opacity="1"/><stop offset="100%" stop-color="#5fd0ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8a5cff" stop-opacity="0"/><stop offset="40%" stop-color="#cfe4ff" stop-opacity="1"/><stop offset="100%" stop-color="#ff2fd0" stop-opacity="0"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff2fd0" stop-opacity="0"/><stop offset="40%" stop-color="#ff2fd0" stop-opacity="1"/><stop offset="100%" stop-color="#ff2fd0" stop-opacity="0"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff6ec7" stop-opacity="0"/><stop offset="40%" stop-color="#ff6ec7" stop-opacity="1"/><stop offset="100%" stop-color="#ff6ec7" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="textGlow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .brand{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:22px;letter-spacing:3px}
      @keyframes blink1{0%,100%{opacity:0.25}40%,60%{opacity:1}}
      @keyframes blink2{0%,100%{opacity:0.2}35%,55%{opacity:1}}
      @keyframes blink3{0%,100%{opacity:0.3}45%,65%{opacity:1}}
      @keyframes blink4{0%,100%{opacity:0.2}30%,50%{opacity:1}}
      @keyframes blink5{0%,100%{opacity:0.25}50%,70%{opacity:1}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @keyframes flow{0%{stroke-dashoffset:40}100%{stroke-dashoffset:0}}
      @keyframes pkt{0%{transform:translateY(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(140px);opacity:0}}
      .b1{animation:blink1 1.6s ease-in-out infinite, float 3s ease-in-out infinite}
      .b2{animation:blink2 1.9s ease-in-out 0.2s infinite, float 3.2s ease-in-out 0.3s infinite}
      .b3{animation:blink3 1.4s ease-in-out 0.4s infinite, float 2.8s ease-in-out 0.1s infinite}
      .b4{animation:blink4 2.0s ease-in-out 0.1s infinite, float 3.4s ease-in-out 0.5s infinite}
      .b5{animation:blink5 1.7s ease-in-out 0.3s infinite, float 3.0s ease-in-out 0.2s infinite}
      .flow{stroke-dasharray:5 9;animation:flow 1.1s linear infinite}
      .p1{animation:pkt 1.8s ease-in-out infinite}
      .p2{animation:pkt 1.8s ease-in-out 0.35s infinite}
      .p3{animation:pkt 1.8s ease-in-out 0.7s infinite}
      .p4{animation:pkt 1.8s ease-in-out 1.05s infinite}
      .p5{animation:pkt 1.8s ease-in-out 1.4s infinite}
    </style>
  </defs>
  <rect width="1200" height="160" fill="#060a12"/>
  <rect width="1200" height="160" fill="url(#dots)"/>
  <rect x="20" y="8" width="1160" height="144" rx="10" fill="#0a0e18" stroke="#152743" stroke-width="1"/>
  <rect x="20" y="8" width="1160" height="22" rx="10" fill="#0c1422"/>
  <rect x="20" y="22" width="1160" height="8" fill="#0c1422"/>
  <circle cx="42" cy="19" r="4" fill="#ff5f57"/>
  <circle cx="56" cy="19" r="4" fill="#febc2e"/>
  <circle cx="70" cy="19" r="4" fill="#28c840"/>
  <text x="600" y="22" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#3d5a80">socks7 · brand pulse · fabric</text>
  <g filter="url(#textGlow)">
    <text x="200" y="95" text-anchor="middle" class="brand b1" fill="#00f0ff">𝑆𝑂𝐶𝐾𝑆7</text>
    <text x="400" y="95" text-anchor="middle" class="brand b2" fill="#5fd0ff">𝑆𝑂𝐶𝐾𝑆7</text>
    <text x="600" y="95" text-anchor="middle" class="brand b3" fill="#8a5cff">𝑆𝑂𝐶𝐾𝑆7</text>
    <text x="800" y="95" text-anchor="middle" class="brand b4" fill="#ff2fd0">𝑆𝑂𝐶𝐾𝑆7</text>
    <text x="1000" y="95" text-anchor="middle" class="brand b5" fill="#ff6ec7">𝑆𝑂𝐶𝐾𝑆7</text>
  </g>
  <text x="200" y="118" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#1a3a55" class="b1">𝑣7.0</text>
  <text x="400" y="118" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#1a3a55" class="b2">𝑚𝑢𝑥</text>
  <text x="600" y="118" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#1a3a55" class="b3">𝑧𝑘</text>
  <text x="800" y="118" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#1a3a55" class="b4">𝑓𝑎𝑠𝑡</text>
  <text x="1000" y="118" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#1a3a55" class="b5">𝑠𝑒𝑐𝑢𝑟𝑒</text>
  <line x1="200" y1="30" x2="200" y2="150" stroke="url(#g1)" stroke-width="3.5" filter="url(#glow)" opacity="0.85"/>
  <line x1="200" y1="30" x2="200" y2="150" stroke="#00f0ff" stroke-width="1.2" opacity="0.7" class="flow"/>
  <circle cx="200" cy="32" r="3.5" fill="#00f0ff" class="p1" filter="url(#glow)"/>
  <line x1="400" y1="30" x2="400" y2="150" stroke="url(#g2)" stroke-width="3.5" filter="url(#glow)" opacity="0.85"/>
  <line x1="400" y1="30" x2="400" y2="150" stroke="#5fd0ff" stroke-width="1.2" opacity="0.7" class="flow"/>
  <circle cx="400" cy="32" r="3.5" fill="#5fd0ff" class="p2" filter="url(#glow)"/>
  <line x1="600" y1="30" x2="600" y2="150" stroke="url(#g3)" stroke-width="4.5" filter="url(#glow)" opacity="0.95"/>
  <line x1="600" y1="30" x2="600" y2="150" stroke="#cfe4ff" stroke-width="1.5" opacity="0.85" class="flow"/>
  <circle cx="600" cy="32" r="4.5" fill="#8a5cff" class="p3" filter="url(#glow)"/>
  <line x1="800" y1="30" x2="800" y2="150" stroke="url(#g4)" stroke-width="3.5" filter="url(#glow)" opacity="0.85"/>
  <line x1="800" y1="30" x2="800" y2="150" stroke="#ff2fd0" stroke-width="1.2" opacity="0.7" class="flow"/>
  <circle cx="800" cy="32" r="3.5" fill="#ff2fd0" class="p4" filter="url(#glow)"/>
  <line x1="1000" y1="30" x2="1000" y2="150" stroke="url(#g5)" stroke-width="3.5" filter="url(#glow)" opacity="0.85"/>
  <line x1="1000" y1="30" x2="1000" y2="150" stroke="#ff6ec7" stroke-width="1.2" opacity="0.7" class="flow"/>
  <circle cx="1000" cy="32" r="3.5" fill="#ff6ec7" class="p5" filter="url(#glow)"/>
</svg>
