<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" role="img" aria-label="SOCKS7 Hero">
  <defs>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#1a2a42" opacity="0.65"/>
      <circle cx="13" cy="11" r="0.7" fill="#152438" opacity="0.5"/>
      <circle cx="7" cy="17" r="0.6" fill="#1c3048" opacity="0.4"/>
    </pattern>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="40%" stop-color="#8a5cff"/>
      <stop offset="100%" stop-color="#ff2fd0"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff2fd0" stop-opacity="0"/>
    </linearGradient>
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
      @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
      @keyframes scan { 0%{transform:translateX(-100%)} 100%{transform:translateX(200%)} }
      .float { animation: float 4s ease-in-out infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .scan { animation: scan 6s linear infinite; }
    </style>
  </defs>
  <rect width="1200" height="380" fill="#060a12"/>
  <rect width="1200" height="380" fill="url(#dots)"/>
  <g stroke="#12203a" stroke-width="0.6" opacity="0.5">
    <line x1="0" y1="95" x2="1200" y2="95"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="285" x2="1200" y2="285"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="800" y1="0" x2="800" y2="380"/>
    <line x1="1000" y1="0" x2="1000" y2="380"/>
  </g>
  <rect x="0" y="0" width="180" height="380" fill="url(#glowLine)" opacity="0.12" class="scan"/>
  <g class="float" filter="url(#textGlow)">
    <text x="600" y="155" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="url(#neon)" letter-spacing="12">𝑆𝑂𝐶𝐾𝑆7</text>
  </g>
  <text x="600" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#7ec8ff" class="pulse" letter-spacing="4">𝑁𝑒𝑥𝑡 𝐺𝑒𝑛𝑒𝑟𝑎𝑡𝑖𝑜𝑛 𝐸𝑛𝑐𝑟𝑦𝑝𝑡𝑒𝑑 𝑃𝑟𝑜𝑥𝑦 𝑃𝑟𝑜𝑡𝑜𝑐𝑜𝑙</text>
  <text x="600" y="255" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#3d5a80">// 𝑚𝑢𝑙𝑡𝑖𝑝𝑙𝑒𝑥𝑒𝑑 · 𝑧𝑒𝑟𝑜-𝑘𝑛𝑜𝑤𝑙𝑒𝑑𝑔𝑒 · 𝑓𝑜𝑟𝑤𝑎𝑟𝑑 𝑠𝑒𝑐𝑟𝑒𝑐𝑦</text>
  <rect x="430" y="290" width="70" height="3" rx="2" fill="#00f0ff" opacity="0.9"/>
  <rect x="510" y="290" width="180" height="3" rx="2" fill="url(#neon)"/>
  <rect x="700" y="290" width="70" height="3" rx="2" fill="#ff2fd0" opacity="0.9"/>
  <text x="600" y="340" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#2a4060">𝑣7.0 · 𝑠ℎ𝑖𝑝𝑝𝑖𝑛𝑔</text>
</svg>
