<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="SOCKS7 hero banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060a12"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#8a5cff"/>
      <stop offset="100%" stop-color="#ff2fd0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes slide { from{transform:translateX(-20px);opacity:0} to{transform:translateX(0);opacity:1} }
      .slide { animation: slide 1.2s ease-out forwards; }
    </style>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <!-- grid lines -->
  <g stroke="#152743" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>
  <!-- main title -->
  <text x="600" y="130" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="64" font-weight="700" fill="url(#neon)" filter="url(#glow)" class="slide" letter-spacing="8">SOCKS7</text>
  <text x="600" y="180" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="18" fill="#5fd0ff" class="pulse" letter-spacing="4">NEXT-GEN ENCRYPTED PROXY PROTOCOL</text>
  <text x="600" y="230" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="14" fill="#40598a">// multiplexed · zero-knowledge · forward secrecy</text>
  <!-- accent bars -->
  <rect x="420" y="260" width="80" height="3" rx="1.5" fill="#00f0ff" opacity="0.8"/>
  <rect x="520" y="260" width="160" height="3" rx="1.5" fill="url(#neon)"/>
  <rect x="700" y="260" width="80" height="3" rx="1.5" fill="#ff2fd0" opacity="0.8"/>
</svg>
