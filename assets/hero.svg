<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="400" role="img" aria-label="SOCKS7 Hero">
  <defs>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#1a2a42" opacity="0.65"/>
      <circle cx="13" cy="11" r="0.7" fill="#152438" opacity="0.5"/>
      <circle cx="7" cy="17" r="0.6" fill="#1c3048" opacity="0.4"/>
    </pattern>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="40%" stop-color="#8a5cff"/>
      <stop offset="100%" stop-color="#ff2fd0"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff2fd0"/>
    </linearGradient>
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softG"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
      @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
      @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes spinR { from{transform:rotate(360deg)} to{transform:rotate(0deg)} }
      @keyframes orbit { from{transform:rotate(0deg) translateX(48px) rotate(0deg)} to{transform:rotate(360deg) translateX(48px) rotate(-360deg)} }
      @keyframes blink { 0%,100%{opacity:0.3} 50%{opacity:1} }
      .float { animation: float 4s ease-in-out infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .spin { animation: spin 12s linear infinite; transform-origin: 160px 200px; }
      .spinR { animation: spinR 8s linear infinite; transform-origin: 1040px 200px; }
      .orbit { animation: orbit 5s linear infinite; transform-origin: 0 0; }
      .blink { animation: blink 2s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="1200" height="400" fill="#060a12"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  <g transform="translate(160,200)" filter="url(#softG)">
    <circle r="52" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.4" class="spin" style="transform-origin:0 0"/>
    <circle r="38" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.5" stroke-dasharray="6 8" class="spinR" style="transform-origin:0 0"/>
    <circle r="22" fill="#0c1a2e" stroke="#00f0ff" stroke-width="1.5"/>
    <text text-anchor="middle" y="6" font-family="Georgia,serif" font-size="16" fill="#00f0ff" font-weight="700">𝑆7</text>
    <circle r="4" fill="#00f0ff" class="orbit"/>
  </g>
  <g transform="translate(1040,200)" filter="url(#softG)">
    <circle r="52" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.4" class="spinR" style="transform-origin:0 0"/>
    <circle r="38" fill="none" stroke="#ff2fd0" stroke-width="1" opacity="0.5" stroke-dasharray="6 8" class="spin" style="transform-origin:0 0"/>
    <circle r="22" fill="#0c1a2e" stroke="#ff2fd0" stroke-width="1.5"/>
    <text text-anchor="middle" y="6" font-family="Georgia,serif" font-size="14" fill="#ff2fd0" font-weight="700">𝑣7</text>
    <circle r="4" fill="#ff2fd0" class="orbit" style="animation-delay:1s"/>
  </g>
  <g class="float" filter="url(#textGlow)">
    <text x="600" y="165" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="url(#neon)" letter-spacing="12">𝑆𝑂𝐶𝐾𝑆7</text>
  </g>
  <text x="600" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#7ec8ff" class="pulse" letter-spacing="4">𝑁𝑒𝑥𝑡 𝐺𝑒𝑛𝑒𝑟𝑎𝑡𝑖𝑜𝑛 𝐸𝑛𝑐𝑟𝑦𝑝𝑡𝑒𝑑 𝑃𝑟𝑜𝑥𝑦 𝑃𝑟𝑜𝑡𝑜𝑐𝑜𝑙</text>
  <text x="600" y="265" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#3d5a80">// 𝑚𝑢𝑙𝑡𝑖𝑝𝑙𝑒𝑥𝑒𝑑 · 𝑧𝑒𝑟𝑜-𝑘𝑛𝑜𝑤𝑙𝑒𝑑𝑔𝑒 · 𝑓𝑜𝑟𝑤𝑎𝑟𝑑 𝑠𝑒𝑐𝑟𝑒𝑐𝑦</text>
  <g class="blink">
    <rect x="380" y="310" width="90" height="28" rx="14" fill="#0c1a2e" stroke="#00f0ff" stroke-width="1"/>
    <text x="425" y="329" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#00f0ff">ONLINE</text>
    <rect x="485" y="310" width="110" height="28" rx="14" fill="#0c1a2e" stroke="#8a5cff" stroke-width="1"/>
    <text x="540" y="329" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#8a5cff">MUX · ACTIVE</text>
    <rect x="610" y="310" width="100" height="28" rx="14" fill="#0c1a2e" stroke="#3fe0a0" stroke-width="1"/>
    <text x="660" y="329" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3fe0a0">𝑣7.0 LIVE</text>
    <rect x="725" y="310" width="90" height="28" rx="14" fill="#0c1a2e" stroke="#ff2fd0" stroke-width="1"/>
    <text x="770" y="329" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff2fd0">SECURE</text>
  </g>
</svg>
