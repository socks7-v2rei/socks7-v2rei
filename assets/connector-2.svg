<style>
.c{font-family:ui-monospace,Menlo,monospace;font-size:9.5px}
@keyframes sc1{0%{transform:translateY(0)}100%{transform:translateY(-70px)}}
@keyframes sc2{0%{transform:translateY(0)}100%{transform:translateY(-60px)}}
@keyframes sc3{0%{transform:translateY(0)}100%{transform:translateY(-80px)}}
