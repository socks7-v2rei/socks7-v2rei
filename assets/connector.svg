<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" width="100%" height="100" role="img" aria-label="five tunnel connectors">
  <defs>
    <linearGradient id="tun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#00f0ff" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#8a5cff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff2fd0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e8f4ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff2fd0" stop-opacity="0"/>
    </linearGradient>
    <filter id="g">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes flowDown {
        0%   { stroke-dashoffset: 36; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes packet {
        0%   { transform: translateY(-16px); opacity: 0; }
        12%  { opacity: 1; }
        88%  { opacity: 1; }
        100% { transform: translateY(100px); opacity: 0; }
      }
      .flow {
        stroke-dasharray: 5 9;
        animation: flowDown 1.3s linear infinite;
      }
      .pkt1 { animation: packet 2.2s ease-in-out infinite; }
      .pkt2 { animation: packet 2.2s ease-in-out 0.45s infinite; }
      .pkt3 { animation: packet 2.2s ease-in-out 0.9s infinite; }
      .pkt4 { animation: packet 2.2s ease-in-out 1.35s infinite; }
      .pkt5 { animation: packet 2.2s ease-in-out 1.8s infinite; }
    </style>
  </defs>

  <!-- TUNNEL 1 -->
  <g transform="translate(-160,0)">
    <line x1="598" y1="4" x2="598" y2="96" stroke="url(#tun)" stroke-width="12" opacity="0.22" filter="url(#g)"/>
    <line x1="602" y1="4" x2="602" y2="96" stroke="url(#tun)" stroke-width="12" opacity="0.22" filter="url(#g)"/>
    <line x1="593" y1="6" x2="593" y2="94" stroke="#00f0ff" stroke-width="1.3" opacity="0.5" class="flow"/>
    <line x1="607" y1="6" x2="607" y2="94" stroke="#ff2fd0" stroke-width="1.3" opacity="0.5" class="flow"/>
    <line x1="600" y1="2" x2="600" y2="98" stroke="url(#core)" stroke-width="2.2" opacity="0.9" filter="url(#g)"/>
    <circle cx="600" cy="8" r="2.8" fill="#00f0ff" class="pkt1" filter="url(#g)"/>
    <circle cx="600" cy="8" r="2.2" fill="#8a5cff" class="pkt3" filter="url(#g)"/>
  </g>

  <!-- TUNNEL 2 -->
  <g transform="translate(-80,0)">
    <line x1="598" y1="4" x2="598" y2="96" stroke="url(#tun)" stroke-width="12" opacity="0.22" filter="url(#g)"/>
    <line x1="602" y1="4" x2="602" y2="96" stroke="url(#tun)" stroke-width="12" opacity="0.22" filter="url(#g)"/>
    <line x1="593" y1="6" x2="593" y2="94" stroke="#00f0ff" stroke-width="1.3" opacity="0.5" class="flow"/>
    <line x1="607" y1="6" x2="607" y2="94" stroke="#ff2fd0" stroke-width="1.3" opacity="0.5" class="flow"/>
    <line x1="600" y1="2" x2="600" y2="98" stroke="url(#core)" stroke-width="2.2" opacity="0.9" filter="url(#g)"/>
    <circle cx="600" cy="8" r="2.8" fill="#5fd0ff" class="pkt2" filter="url(#g)"/>
    <circle cx="600" cy="8" r="2.2" fill="#ff2fd0" class="pkt4" filter="url(#g)"/>
  </g>

  <!-- TUNNEL 3 (center) -->
  <g>
    <line x1="598" y1="4" x2="598" y2="96" stroke="url(#tun)" stroke-width="14" opacity="0.28" filter="url(#g)"/>
    <line x1="602" y1="4" x2="602" y2="96" stroke="url(#tun)" stroke-width="14" opacity="0.28" filter="url(#g)"/>
    <line x1="592" y1="6" x2="592" y2="94" stroke="#00f0ff" stroke-width="1.5" opacity="0.6" class="flow"/>
    <line x1="608" y1="6" x2="608" y2="94" stroke="#ff2fd0" stroke-width="1.5" opacity="0.6" class="flow"/>
    <line x1="600" y1="2" x2="600" y2="98" stroke="url(#core)" stroke-width="2.6" opacity="1" filter="url(#g)"/>
    <circle cx="600" cy="8" r="3.2" fill="#00f0ff" class="pkt1" filter="url(#g)"/>
    <circle cx="600" cy="8" r="2.5" fill="#8a5cff" class="pkt3" filter="url(#g)"/>
    <circle cx="600" cy="8" r="2.2" fill="#ff2fd0" class="pkt5" filter="url(#g)"/>
  </g>

  <!-- TUNNEL 4 -->
  <g transform="translate(80,0)">
    <line x1="598" y1="4" x2="598" y2="96" stroke="url(#tun)" stroke-width="12" opacity="0.22" filter="url(#g)"/>
    <line x1="602" y1="4" x2="602" y2="96" stroke="url(#tun)" stroke-width="12" opacity="0.22" filter="url(#g)"/>
    <line x1="593" y1="6" x2="593" y2="94" stroke="#00f0ff" stroke-width="1.3" opacity="0.5" class="flow"/>
    <line x1="607" y1="6" x2="607" y2="94" stroke="#ff2fd0" stroke-width="1.3" opacity="0.5" class="flow"/>
    <line x1="600" y1="2" x2="600" y2="98" stroke="url(#core)" stroke-width="2.2" opacity="0.9" filter="url(#g)"/>
    <circle cx="600" cy="8" r="2.8" fill="#8a5cff" class="pkt2" filter="url(#g)"/>
    <circle cx="600" cy="8" r="2.2" fill="#00f0ff" class="pkt4" filter="url(#g)"/>
  </g>

  <!-- TUNNEL 5 -->
  <g transform="translate(160,0)">
    <line x1="598" y1="4" x2="598" y2="96" stroke="url(#tun)" stroke-width="12" opacity="0.22" filter="url(#g)"/>
    <line x1="602" y1="4" x2="602" y2="96" stroke="url(#tun)" stroke-width="12" opacity="0.22" filter="url(#g)"/>
    <line x1="593" y1="6" x2="593" y2="94" stroke="#00f0ff" stroke-width="1.3" opacity="0.5" class="flow"/>
    <line x1="607" y1="6" x2="607" y2="94" stroke="#ff2fd0" stroke-width="1.3" opacity="0.5" class="flow"/>
    <line x1="600" y1="2" x2="600" y2="98" stroke="url(#core)" stroke-width="2.2" opacity="0.9" filter="url(#g)"/>
    <circle cx="600" cy="8" r="2.8" fill="#ff2fd0" class="pkt1" filter="url(#g)"/>
    <circle cx="600" cy="8" r="2.2" fill="#5fd0ff" class="pkt3" filter="url(#g)"/>
  </g>

</svg>
