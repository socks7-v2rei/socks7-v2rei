<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="100%" height="90" role="img" aria-label="tunnel connector">
  <defs>
    <linearGradient id="tun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#8a5cff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff2fd0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#cfe4ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff2fd0" stop-opacity="0"/>
    </linearGradient>
    <filter id="g">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes flowDown {
        0%   { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes packet {
        0%   { transform: translateY(-20px); opacity: 0; }
        15%  { opacity: 1; }
        85%  { opacity: 1; }
        100% { transform: translateY(90px); opacity: 0; }
      }
      .flow {
        stroke-dasharray: 6 10;
        animation: flowDown 1.4s linear infinite;
      }
      .pkt1 { animation: packet 2.4s ease-in-out infinite; }
      .pkt2 { animation: packet 2.4s ease-in-out 0.8s infinite; }
      .pkt3 { animation: packet 2.4s ease-in-out 1.6s infinite; }
    </style>
  </defs>
  <line x1="598" y1="4" x2="598" y2="86" stroke="url(#tun)" stroke-width="14" opacity="0.25" filter="url(#g)"/>
  <line x1="602" y1="4" x2="602" y2="86" stroke="url(#tun)" stroke-width="14" opacity="0.25" filter="url(#g)"/>
  <line x1="592" y1="6" x2="592" y2="84" stroke="#00f0ff" stroke-width="1.5" opacity="0.55" class="flow"/>
  <line x1="608" y1="6" x2="608" y2="84" stroke="#ff2fd0" stroke-width="1.5" opacity="0.55" class="flow"/>
  <line x1="600" y1="2" x2="600" y2="88" stroke="url(#core)" stroke-width="2.5" opacity="0.95" filter="url(#g)"/>
  <circle cx="600" cy="10" r="3.2" fill="#00f0ff" class="pkt1" filter="url(#g)"/>
  <circle cx="600" cy="10" r="2.4" fill="#8a5cff" class="pkt2" filter="url(#g)"/>
  <circle cx="600" cy="10" r="2.8" fill="#ff2fd0" class="pkt3" filter="url(#g)"/>
  <circle cx="580" cy="45" r="2" fill="#00f0ff" opacity="0.5"/>
  <circle cx="620" cy="45" r="2" fill="#ff2fd0" opacity="0.5"/>
  <line x1="582" y1="45" x2="590" y2="45" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>
  <line x1="610" y1="45" x2="618" y2="45" stroke="#ff2fd0" stroke-width="1" opacity="0.4"/>
</svg>
