<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="460" role="img" aria-label="SOCKS7 handshake sequence">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#060a12"/><stop offset="100%" stop-color="#0a1628"/></linearGradient>
    <style>.h{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:13px;fill:#cfe4ff}.s{font-size:11px;fill:#5fd0ff}@keyframes fade{0%,100%{opacity:.4}50%{opacity:1}}.f{animation:fade 2s ease-in-out infinite}</style>
  </defs>
  <rect width="1200" height="460" fill="url(#hbg)"/>
  <text x="600" y="36" text-anchor="middle" class="h" font-size="16" letter-spacing="3">// 2-RTT ZERO-KNOWLEDGE HANDSHAKE</text>
  <!-- Client column -->
  <rect x="60" y="70" width="200" height="50" rx="8" fill="#101d33" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="160" y="100" text-anchor="middle" class="h">CLIENT</text>
  <!-- Server column -->
  <rect x="940" y="70" width="200" height="50" rx="8" fill="#101d33" stroke="#8a5cff" stroke-width="1.5"/>
  <text x="1040" y="100" text-anchor="middle" class="h">EDGE</text>
  <!-- RTT 1 -->
  <text x="600" y="150" text-anchor="middle" class="s">RTT 1 · ephemeral X25519 + PSK commit</text>
  <path d="M270 180 L920 180" stroke="#00f0ff" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="600" y="175" text-anchor="middle" class="s" fill="#00f0ff">ClientHello · nonce · pubkey</text>
  <path d="M920 220 L270 220" stroke="#8a5cff" stroke-width="2" fill="none"/>
  <text x="600" y="215" text-anchor="middle" class="s" fill="#8a5cff">ServerHello · pubkey · proof</text>
  <!-- RTT 2 -->
  <text x="600" y="270" text-anchor="middle" class="s">RTT 2 · session keys derived · streams open</text>
  <path d="M270 300 L920 300" stroke="#3fe0a0" stroke-width="2" fill="none"/>
  <text x="600" y="295" text-anchor="middle" class="s" fill="#3fe0a0">Finished · first app data (0-RTT capable)</text>
  <!-- result -->
  <rect x="300" y="350" width="600" height="70" rx="10" fill="#0c1a2e" stroke="#00f0ff" stroke-width="1" class="f"/>
  <text x="600" y="380" text-anchor="middle" class="h" fill="#00f0ff">✓ Forward secrecy established</text>
  <text x="600" y="405" text-anchor="middle" class="s">XChaCha20-Poly1305 · unlimited mux streams ready</text>
</svg>
