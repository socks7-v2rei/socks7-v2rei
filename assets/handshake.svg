<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="100%" height="400" role="img" aria-label="Handshake">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050810"/><stop offset="100%" stop-color="#0a1424"/>
    </linearGradient>
    <filter id="hg"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .t{font-family:Georgia,'Times New Roman',serif}
      .m{font-family:ui-monospace,monospace}
      @keyframes slide{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
      .s1{animation:slide 0.6s ease 0.2s both}
      .s2{animation:slide 0.6s ease 0.6s both}
      .s3{animation:slide 0.6s ease 1.0s both}
      @keyframes pulse{0%,100%{opacity:0.6}50%{opacity:1}}
      .p{animation:pulse 2.2s ease-in-out infinite}
    </style>
  </defs>
  <rect width="1100" height="400" rx="14" fill="url(#hbg)"/>
  <text x="550" y="40" text-anchor="middle" class="t" font-size="18" fill="#cfe4ff" letter-spacing="3">𝑇ℎ𝑒 ℎ𝑎𝑛𝑑𝑠ℎ𝑎𝑘𝑒 · 2-𝑅𝑇𝑇 𝑧𝑒𝑟𝑜-𝑘𝑛𝑜𝑤𝑙𝑒𝑑𝑔𝑒</text>
  <rect x="50" y="70" width="180" height="48" rx="10" fill="#0c1a2e" stroke="#00f0ff" stroke-width="1.4"/>
  <text x="140" y="100" text-anchor="middle" class="t" font-size="16" fill="#00f0ff">𝐶𝐿𝐼𝐸𝑁𝑇</text>
  <rect x="870" y="70" width="180" height="48" rx="10" fill="#0c1a2e" stroke="#8a5cff" stroke-width="1.4"/>
  <text x="960" y="100" text-anchor="middle" class="t" font-size="16" fill="#8a5cff">𝐸𝐷𝐺𝐸</text>
  <g class="s1">
    <text x="550" y="150" text-anchor="middle" class="m" font-size="13" fill="#5a7096">𝑅𝑇𝑇 1 · 𝑒𝑝ℎ𝑒𝑚𝑒𝑟𝑎𝑙 𝑋25519 + 𝑃𝑆𝐾 𝑐𝑜𝑚𝑚𝑖𝑡</text>
    <line x1="240" y1="175" x2="850" y2="175" stroke="#00f0ff" stroke-width="2"/>
    <text x="550" y="170" text-anchor="middle" class="m" font-size="13" fill="#00f0ff">𝐶𝑙𝑖𝑒𝑛𝑡𝐻𝑒𝑙𝑙𝑜 · 𝑛𝑜𝑛𝑐𝑒 · 𝑝𝑢𝑏𝑘𝑒𝑦</text>
    <line x1="850" y1="210" x2="240" y2="210" stroke="#8a5cff" stroke-width="2"/>
    <text x="550" y="205" text-anchor="middle" class="m" font-size="13" fill="#8a5cff">𝑆𝑒𝑟𝑣𝑒𝑟𝐻𝑒𝑙𝑙𝑜 · 𝑝𝑢𝑏𝑘𝑒𝑦 · 𝑝𝑟𝑜𝑜𝑓</text>
  </g>
  <g class="s2">
    <text x="550" y="260" text-anchor="middle" class="m" font-size="13" fill="#5a7096">𝑅𝑇𝑇 2 · 𝑠𝑒𝑠𝑠𝑖𝑜𝑛 𝑘𝑒𝑦𝑠 𝑑𝑒𝑟𝑖𝑣𝑒𝑑</text>
    <line x1="240" y1="285" x2="850" y2="285" stroke="#3fe0a0" stroke-width="2"/>
    <text x="550" y="280" text-anchor="middle" class="m" font-size="13" fill="#3fe0a0">𝐹𝑖𝑛𝑖𝑠ℎ𝑒𝑑 · 𝑓𝑖𝑟𝑠𝑡 𝑎𝑝𝑝 𝑑𝑎𝑡𝑎 (0-𝑅𝑇𝑇 𝑐𝑎𝑝𝑎𝑏𝑙𝑒)</text>
  </g>
  <g class="s3 p" filter="url(#hg)">
    <rect x="250" y="320" width="600" height="55" rx="12" fill="#0c1a2e" stroke="#00f0ff" stroke-width="1.2"/>
    <text x="550" y="345" text-anchor="middle" class="t" font-size="15" fill="#00f0ff">✓ 𝐹𝑜𝑟𝑤𝑎𝑟𝑑 𝑠𝑒𝑐𝑟𝑒𝑐𝑦 𝑒𝑠𝑡𝑎𝑏𝑙𝑖𝑠ℎ𝑒𝑑</text>
    <text x="550" y="365" text-anchor="middle" class="m" font-size="12" fill="#8a5cff">𝑋𝐶ℎ𝑎𝐶ℎ𝑎20-𝑃𝑜𝑙𝑦1305 · 𝑢𝑛𝑙𝑖𝑚𝑖𝑡𝑒𝑑 𝑚𝑢𝑥 𝑠𝑡𝑟𝑒𝑎𝑚𝑠 𝑟𝑒𝑎𝑑𝑦</text>
  </g>
</svg>
