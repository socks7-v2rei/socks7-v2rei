<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="100%" height="340" role="img" aria-label="Metrics">
  <defs>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#1a2a42" opacity="0.65"/>
      <circle cx="13" cy="11" r="0.7" fill="#152438" opacity="0.5"/>
      <circle cx="7" cy="17" r="0.6" fill="#1c3048" opacity="0.4"/>
    </pattern>
    <filter id="mg"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .t{font-family:Georgia,'Times New Roman',serif}
      .m{font-family:ui-monospace,monospace}
      @keyframes pulse{0%,100%{opacity:0.65}50%{opacity:1}}
      .p{animation:pulse 2.4s ease-in-out infinite}
      .p2{animation:pulse 2.4s ease-in-out 0.4s infinite}
      .p3{animation:pulse 2.4s ease-in-out 0.8s infinite}
      .p4{animation:pulse 2.4s ease-in-out 1.2s infinite}
    </style>
  </defs>
  <rect width="1100" height="340" rx="14" fill="#060a12"/><rect width="1100" height="340" rx="14" fill="url(#dots)"/>
  <text x="550" y="38" text-anchor="middle" class="t" font-size="18" fill="#cfe4ff" letter-spacing="3">𝐿𝑖𝑣𝑒 𝑡𝑒𝑙𝑒𝑚𝑒𝑡𝑟𝑦</text>
  <g class="p" filter="url(#mg)">
    <rect x="40" y="70" width="240" height="110" rx="12" fill="#0c1a2e" stroke="#152743"/>
    <text x="160" y="120" text-anchor="middle" class="t" font-size="32" fill="#00f0ff">0.8 𝑚𝑠</text>
    <text x="160" y="155" text-anchor="middle" class="m" font-size="13" fill="#5a7096">ℎ𝑎𝑛𝑑𝑠ℎ𝑎𝑘𝑒 𝑙𝑎𝑡𝑒𝑛𝑐𝑦</text>
  </g>
  <g class="p2" filter="url(#mg)">
    <rect x="310" y="70" width="240" height="110" rx="12" fill="#0c1a2e" stroke="#152743"/>
    <text x="430" y="120" text-anchor="middle" class="t" font-size="32" fill="#8a5cff">12.4𝑘</text>
    <text x="430" y="155" text-anchor="middle" class="m" font-size="13" fill="#5a7096">𝑠𝑡𝑟𝑒𝑎𝑚𝑠 / 𝑠𝑜𝑐𝑘𝑒𝑡</text>
  </g>
  <g class="p3" filter="url(#mg)">
    <rect x="580" y="70" width="240" height="110" rx="12" fill="#0c1a2e" stroke="#152743"/>
    <text x="700" y="120" text-anchor="middle" class="t" font-size="32" fill="#3fe0a0">99.99%</text>
    <text x="700" y="155" text-anchor="middle" class="m" font-size="13" fill="#5a7096">𝑢𝑝𝑡𝑖𝑚𝑒 (30𝑑)</text>
  </g>
  <g class="p4" filter="url(#mg)">
    <rect x="850" y="70" width="210" height="110" rx="12" fill="#0c1a2e" stroke="#152743"/>
    <text x="955" y="120" text-anchor="middle" class="t" font-size="32" fill="#ff2fd0">3.2 µ𝑠</text>
    <text x="955" y="155" text-anchor="middle" class="m" font-size="13" fill="#5a7096">𝑝𝑒𝑟-𝑝𝑎𝑐𝑘𝑒𝑡 𝑜𝑣𝑒𝑟ℎ𝑒𝑎𝑑</text>
  </g>
  <rect x="40" y="210" width="1020" height="100" rx="12" fill="#0c1a2e" stroke="#152743"/>
  <text x="70" y="250" class="m" font-size="13" fill="#5fd0ff">𝑎𝑐𝑡𝑖𝑣𝑒 𝑒𝑑𝑔𝑒𝑠</text>
  <text x="70" y="280" class="t" font-size="20" fill="#3fe0a0">𝑒𝑑𝑔𝑒-𝑒𝑢 · 𝑒𝑑𝑔𝑒-𝑢𝑠 · 𝑒𝑑𝑔𝑒-𝑎𝑝</text>
  <text x="700" y="255" class="m" font-size="14" fill="#00f0ff">𝑐𝑖𝑝ℎ𝑒𝑟: 𝑋𝐶ℎ𝑎𝐶ℎ𝑎20-𝑃𝑜𝑙𝑦1305</text>
  <text x="700" y="285" class="m" font-size="14" fill="#8a5cff">𝑜𝑏𝑓𝑠: 𝑇𝐿𝑆 1.3 𝑐𝑜𝑣𝑒𝑟</text>
</svg>
