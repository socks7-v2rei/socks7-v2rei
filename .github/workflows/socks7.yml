name: SOCKS7 Fabric Refresh

# Rebuilds assets/contribution-network.svg from your real GitHub activity
# once a day (and on demand). Nothing external — the generator lives in
# scripts/generate_contribution.py.

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_contribution.py"
      - ".github/workflows/socks7.yml"

permissions:
  contents: write

concurrency:
  group: socks7-fabric
  cancel-in-progress: true

jobs:
  fabric:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the SOCKS7 fabric
        env:
          # Add a fine-grained PAT named GH_PAT if the default token cannot
          # read contributions. Otherwise the script falls back gracefully.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
          OUT: assets/contribution-network.svg
        run: python3 scripts/generate_contribution.py

      - name: Commit changes
        run: |
          git config user.name "socks7-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets/contribution-network.svg
          if git diff --staged --quiet; then
            echo "no changes — fabric is up to date"
          else
            git commit -m "chore(fabric): refresh SOCKS7 contribution network [skip ci]"
            git push
          fi
